runtime:
  default_time_window: "24h"
  allowed_time_windows: ["6h", "24h", "3d", "7d"]
  request_timeout_seconds: 20
  source_fetch_timeout_seconds: 6
  max_clusters_per_run: 40
  max_llm_analysis_per_run: 20
  max_concurrent_llm_analysis: 10
  backfill_unanalyzed_clusters: false
  user_agent: "market-impact-radar/0.1 (+https://github.com/your-org/market-impact-radar)"

scheduler:
  enabled: true
  mode: interval # interval / custom_time / market_daily
  interval_minutes: 30
  timezone: Asia/Shanghai
  custom_hour: 18
  custom_minute: 0
  noon_hour: 12
  noon_minute: 0
  pre_open_hour: 9
  pre_open_minute: 0

scoring:
  push_score_threshold: 70
  duplicate_push_window_hours: 12
  score_delta_for_repush: 15
  push_source_scope: all # all / domestic / foreign
  weights:
    event_severity_score: 0.24
    market_scope_score: 0.18
    asset_sensitivity_score: 0.18
    credibility_score: 0.16
    novelty_score: 0.14
    timeliness_score: 0.10

